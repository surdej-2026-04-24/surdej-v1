name: Deploy to AKS

on:
  workflow_run:
    workflows: ["Build Containers"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (default: latest)"
        required: false
        default: "latest"

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}
  AKS_CLUSTER: aks-happy-mates-sweden1
  AKS_RESOURCE_GROUP: rg-happy-mates-sweden1
  KEY_VAULT: kv-happy-mates-sweden1
  NAMESPACE: surdej2026024

jobs:
  deploy:
    name: Deploy to AKS
    runs-on: ubuntu-latest
    # Only deploy if the build succeeded (or manual trigger)
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    permissions:
      contents: read
      packages: read
      id-token: write

    env:
      AZURE_CLIENT_ID: 96bccee5-66ae-4151-bbfc-78a60d848790
      AZURE_TENANT_ID: 8bfad545-8650-4872-a917-20c9720b906b
      AZURE_SUBSCRIPTION_ID: 742e217b-f6e1-4094-9792-49b71fde2e02

    steps:
      - uses: actions/checkout@v4

      - name: Determine image tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.image_tag || 'latest' }}" >> $GITHUB_OUTPUT
            echo "sha=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT
          else
            HEAD_SHA="${{ github.event.workflow_run.head_sha }}"
            REF="${{ github.event.workflow_run.head_branch }}"
            if [[ "$REF" == v* ]]; then
              echo "tag=${REF}" >> $GITHUB_OUTPUT
            else
              echo "tag=latest" >> $GITHUB_OUTPUT
            fi
            echo "sha=$(echo ${HEAD_SHA} | cut -c1-7)" >> $GITHUB_OUTPUT
          fi

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: 96bccee5-66ae-4151-bbfc-78a60d848790
          tenant-id: 8bfad545-8650-4872-a917-20c9720b906b
          subscription-id: 742e217b-f6e1-4094-9792-49b71fde2e02

      - name: Install kubelogin
        uses: azure/use-kubelogin@v1
        with:
          kubelogin-version: 'v0.1.4'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Get AKS Credentials
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ env.AKS_RESOURCE_GROUP }}
          cluster-name: ${{ env.AKS_CLUSTER }}
          admin: false
          use-kubelogin: true

      - name: Create namespace (if needed)
        run: |
          kubectl apply -f k8s/namespace.yaml

      - name: Sync secrets from Key Vault
        run: |
          NS="${{ env.NAMESPACE }}"
          KV="${{ env.KEY_VAULT }}"
          PREFIX="surdej2026024"

          # Read secrets from Key Vault
          DB_URL=$(az keyvault secret show --vault-name "$KV" --name "${PREFIX}-DATABASE-URL" --query value -o tsv)
          OAI_KEY=$(az keyvault secret show --vault-name "$KV" --name "${PREFIX}-AZURE-OPENAI-API-KEY" --query value -o tsv)
          OAI_ENDPOINT=$(az keyvault secret show --vault-name "$KV" --name "${PREFIX}-AZURE-OPENAI-ENDPOINT" --query value -o tsv)
          BLOB_CONN=$(az keyvault secret show --vault-name "$KV" --name "${PREFIX}-AZURE-STORAGE-CONNECTION-STRING" --query value -o tsv)

          kubectl create secret generic surdej-api-secrets \
            --namespace "$NS" \
            --from-literal=DATABASE_URL="$DB_URL" \
            --from-literal=AZURE_OPENAI_API_KEY="$OAI_KEY" \
            --from-literal=AZURE_OPENAI_ENDPOINT="$OAI_ENDPOINT" \
            --from-literal=AZURE_STORAGE_CONNECTION_STRING="$BLOB_CONN" \
            --save-config --dry-run=client -o yaml | kubectl apply -f -
          echo "✅ Secrets synced from Key Vault"

      - name: Apply ConfigMap
        run: |
          NS="${{ env.NAMESPACE }}"
          kubectl create configmap surdej-api-config \
            --namespace "$NS" \
            --from-literal=NODE_ENV=production \
            --from-literal=PORT=5001 \
            --from-literal=HOST=0.0.0.0 \
            --from-literal=NATS_URL=nats://nats-service.${NS}.svc.cluster.local:4222 \
            --from-literal=AI_PROVIDER=azure \
            --from-literal=AUTH_PROVIDER=${{ vars.VITE_AUTH_PROVIDER || 'entra' }} \
            --from-literal=AZURE_OPENAI_API_VERSION=2024-08-01-preview \
            --from-literal=AZURE_OPENAI_MODEL_LOW=gpt-4o-mini \
            --from-literal=AZURE_OPENAI_MODEL_MEDIUM=gpt-4o \
            --from-literal=AZURE_OPENAI_MODEL_REASONING=o3 \
            --from-literal=STORAGE_PROVIDER=AZURE \
            --from-literal=STORAGE_BUCKET=surdej \
            --save-config --dry-run=client -o yaml | kubectl apply -f -
          echo "✅ ConfigMap applied"

      - name: Create GHCR image pull secret
        run: |
          NS="${{ env.NAMESPACE }}"
          kubectl create secret docker-registry ghcr-secret \
            --docker-server=ghcr.io \
            --docker-username=${{ github.actor }} \
            --docker-password=${{ secrets.GITHUB_TOKEN }} \
            --namespace="$NS" \
            --dry-run=client -o yaml | kubectl apply -f -
          echo "✅ GHCR secret applied"

      - name: Create Cloudflare tunnel credentials secret
        run: |
          NS="${{ env.NAMESPACE }}"
          KV="${{ env.KEY_VAULT }}"
          PREFIX="surdej2026024"
          CF_CREDS=$(az keyvault secret show --vault-name "$KV" --name "${PREFIX}-CLOUDFLARE-TUNNEL-CREDENTIALS" --query value -o tsv)
          kubectl create secret generic cloudflare-tunnel-credentials \
            --namespace="$NS" \
            --from-literal=credentials.json="$CF_CREDS" \
            --dry-run=client -o yaml | kubectl apply -f -
          echo "✅ Cloudflare tunnel credentials secret applied"

      - name: Run database migration
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          SHA="${{ steps.tag.outputs.sha }}"

          # Substitute variables in migration job manifest
          export API_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-api:${TAG}"
          export COMMIT_SHA="${SHA}"

          envsubst < k8s/db-migrate-job.yaml | kubectl apply -f -

          # Wait for migration to complete (timeout 5 min)
          echo "Waiting for migration job to complete..."
          kubectl wait --for=condition=complete \
            --timeout=300s \
            -n ${{ env.NAMESPACE }} \
            job/surdej-db-migrate-${SHA} || {
              echo "Migration job failed or timed out!"
              kubectl logs -n ${{ env.NAMESPACE }} -l job-type=db-migrate --tail=50
              exit 1
            }
          echo "✅ Database migration complete"

      - name: Initialize member-nosql schema
        run: |
          NS="${{ env.NAMESPACE }}"
          DB_URL=$(az keyvault secret show --vault-name "${{ env.KEY_VAULT }}" --name "surdej2026024-DATABASE-URL" --query value -o tsv)
          # Extract postgres connection parts for psql
          PG_HOST=$(echo "$DB_URL" | sed -n 's|.*@\([^:]*\):.*|\1|p')
          PG_PORT=$(echo "$DB_URL" | sed -n 's|.*:\([0-9]*\)/.*|\1|p')
          PG_DB=$(echo "$DB_URL" | sed -n 's|.*/\([^?]*\).*|\1|p')
          PG_USER=$(echo "$DB_URL" | sed -n 's|.*://\([^:]*\):.*|\1|p')
          PG_PASS=$(echo "$DB_URL" | sed -n 's|.*://[^:]*:\([^@]*\)@.*|\1|p')
          # Run schema creation via postgres pod
          PGPASSWORD="$PG_PASS" kubectl exec -n surdej-v1 deployment/postgres -- \
            psql -h "$PG_HOST" -U "$PG_USER" -d "$PG_DB" -c "
              CREATE SCHEMA IF NOT EXISTS member_nosql;
              CREATE TABLE IF NOT EXISTS member_nosql.\"NosqlCollection\" (
                id TEXT NOT NULL PRIMARY KEY, \"tenantId\" TEXT NOT NULL, name TEXT NOT NULL,
                slug TEXT NOT NULL, description TEXT, \"parentId\" TEXT, schema JSONB,
                \"createdAt\" TIMESTAMP(3) NOT NULL DEFAULT CURRENT_TIMESTAMP,
                \"updatedAt\" TIMESTAMP(3) NOT NULL DEFAULT CURRENT_TIMESTAMP,
                \"deletedAt\" TIMESTAMP(3), \"createdBy\" TEXT, \"updatedBy\" TEXT,
                FOREIGN KEY (\"parentId\") REFERENCES member_nosql.\"NosqlCollection\"(id)
              );
              CREATE UNIQUE INDEX IF NOT EXISTS uq_nosqlcollection ON member_nosql.\"NosqlCollection\"(\"tenantId\", \"parentId\", slug);
              CREATE INDEX IF NOT EXISTS idx_nosqlcollection_tenantid ON member_nosql.\"NosqlCollection\"(\"tenantId\");
              CREATE INDEX IF NOT EXISTS idx_nosqlcollection_parentid ON member_nosql.\"NosqlCollection\"(\"parentId\");
              CREATE TABLE IF NOT EXISTS member_nosql.\"NosqlDocument\" (
                id TEXT NOT NULL PRIMARY KEY, \"tenantId\" TEXT NOT NULL, \"collectionId\" TEXT NOT NULL,
                data JSONB NOT NULL, version INT NOT NULL DEFAULT 1,
                \"createdAt\" TIMESTAMP(3) NOT NULL DEFAULT CURRENT_TIMESTAMP,
                \"updatedAt\" TIMESTAMP(3) NOT NULL DEFAULT CURRENT_TIMESTAMP,
                \"deletedAt\" TIMESTAMP(3), \"createdBy\" TEXT, \"updatedBy\" TEXT,
                FOREIGN KEY (\"collectionId\") REFERENCES member_nosql.\"NosqlCollection\"(id)
              );
              CREATE INDEX IF NOT EXISTS idx_nosqldocument_tenantid ON member_nosql.\"NosqlDocument\"(\"tenantId\");
              CREATE INDEX IF NOT EXISTS idx_nosqldocument_collectionid ON member_nosql.\"NosqlDocument\"(\"collectionId\");
              CREATE INDEX IF NOT EXISTS idx_nosqldocument_deletedat ON member_nosql.\"NosqlDocument\"(\"deletedAt\");
              CREATE TABLE IF NOT EXISTS member_nosql.\"NosqlDocumentVersion\" (
                id TEXT NOT NULL PRIMARY KEY, \"documentId\" TEXT NOT NULL, version INT NOT NULL,
                data JSONB NOT NULL, \"createdAt\" TIMESTAMP(3) NOT NULL DEFAULT CURRENT_TIMESTAMP,
                \"createdBy\" TEXT,
                FOREIGN KEY (\"documentId\") REFERENCES member_nosql.\"NosqlDocument\"(id) ON DELETE CASCADE
              );
              CREATE UNIQUE INDEX IF NOT EXISTS uq_nosqldocumentversion ON member_nosql.\"NosqlDocumentVersion\"(\"documentId\", version);
              CREATE INDEX IF NOT EXISTS idx_nosqldocumentversion_documentid ON member_nosql.\"NosqlDocumentVersion\"(\"documentId\");
            " 2>&1 || echo "⚠️ Schema init warning (may already exist)"
          echo "✅ member-nosql schema initialized"

      - name: Deploy infrastructure (NATS, Cloudflare tunnel)
        run: |
          kubectl apply -f k8s/infrastructure.yaml
          echo "✅ Infrastructure deployed (NATS, Cloudflare Tunnel)"

          # Wait for NATS to be ready
          kubectl rollout status deployment/nats -n ${{ env.NAMESPACE }} --timeout=120s

      - name: Deploy all services
        run: |
          TAG="${{ steps.tag.outputs.tag }}"

          # Set image variables
          export API_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-api:${TAG}"
          export FRONTEND_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend:${TAG}"
          export PDF_EXTRACTOR_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-worker-pdf-extractor:${TAG}"
          export WORKER_PDF_REFINERY_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-worker-pdf-refinery:${TAG}"
          export WORKER_KNOWLEDGE_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-worker-knowledge:${TAG}"
          export WORKER_DOCUMENT_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-worker-document:${TAG}"
          export MODULE_NOSQL_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-worker-member-nosql:${TAG}"

          # Apply deployment manifest
          envsubst < k8s/deployment.yaml | kubectl apply -f -
          
          # Force restart API deployment to pick up latest image if tag is 'latest'
          if [ "$TAG" = "latest" ]; then
             kubectl rollout restart deployment/surdej-api -n ${{ env.NAMESPACE }}
          fi

          echo "✅ All deployments applied"

      - name: Wait for rollouts
        run: |
          NS="${{ env.NAMESPACE }}"
          echo "Waiting for API rollout..."
          kubectl rollout status deployment/surdej-api -n $NS --timeout=120s

          echo "Waiting for Frontend rollout..."
          kubectl rollout status deployment/surdej-frontend -n $NS --timeout=120s

          echo "Waiting for Worker rollouts..."
          kubectl rollout status deployment/surdej-worker-pdf-refinery -n $NS --timeout=120s || true
          kubectl rollout status deployment/surdej-worker-knowledge -n $NS --timeout=120s || true
          kubectl rollout status deployment/surdej-worker-document -n $NS --timeout=120s || true
          kubectl rollout status deployment/surdej-module-nosql -n $NS --timeout=120s || true

          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✅ Deployment complete!"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          kubectl get pods -n $NS
